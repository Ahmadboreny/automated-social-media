name: Verify HomeOps V8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-homeops-v8.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public HomeOps frontend
        shell: bash
        run: |
          set -euo pipefail
          URL='https://homeops-control-center-v8-ahmad-c72c.vercel.app/'
          curl -fsSL -D /tmp/headers.txt "$URL" -o /tmp/page.html
          echo '--- HEADERS ---'
          cat /tmp/headers.txt
          echo '--- CONTENT CHECK ---'
          grep -q 'Founder Sign In' /tmp/page.html
          grep -q 'Build 2026.09.15-8' /tmp/page.html
          grep -qi '^content-type: text/html' /tmp/headers.txt
          echo 'HOMEOPS_V8_OK'
